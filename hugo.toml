baseURL = 'https://newwordwall.com/'
languageCode = 'en-us'
title = 'New Word Wall'
theme = "PaperMod"

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = "A study of language in society: from the smallest utterance to the largest questions about human meaning."
  author = "David DeBonis"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  defaultTheme = "auto"

