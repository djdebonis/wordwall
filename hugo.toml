baseURL = 'https://newwordwall.com/'
languageCode = 'en-us'
title = 'New Word Wall'
theme = "PaperMod"
enableRobotsTXT = true
enableGitInfo = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  tag = "tags"
  topic = "topics"
  discipline = "disciplines"
  method = "methods"

[sitemap]
  changeFreq = "weekly"
  priority = 0.7

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = "A study of language in society: from the smallest utterance to the largest questions about human meaning."
  author = "David DeBonis"
  keywords = ["linguistics", "language and society", "sociolinguistics", "language change", "linguistic research"]
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  defaultTheme = "light"
  disableThemeToggle = true

  [params.schema]
    publisherType = "Person"
    sameAs = []

  [params.assets]
    theme_color = "#f5f1e8"

[[menu.main]]
  identifier = "home"
  name = "Home"
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 20

[[menu.main]]
  identifier = "journal"
  name = "Journal"
  url = "/journal/"
  weight = 20

[[menu.main]]
  identifier = "research"
  name = "Research"
  url = "/research/"
  weight = 30

[[menu.main]]
  identifier = "tools"
  name = "Tools"
  url = "/tools/"
  weight = 40

[[menu.main]]
  identifier = "contact"
  name = "Contact"
  url = "/contact/"
  weight = 50
